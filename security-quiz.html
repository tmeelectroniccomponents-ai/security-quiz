<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A short interactive quiz to test your everyday email and password security habits." />
  <meta name="theme-color" content="#eef4fa" />

  <title>Email & Password Security Quiz</title>

  <!-- Google Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
    rel="stylesheet"
  />

  <!-- Material Symbols (Outlined) — used for answer icons (verified_user / gpp_bad) -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=gpp_bad,verified_user"
  />

  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="data/quiz.js"></script>
  <script defer src="js/quiz.js"></script>
</head>

<body>
  <header class="quiz-header">
    <h1 id="quiz-title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <p class="progress" id="progress" role="status" aria-live="polite"></p>

  <main class="quiz-container">
    <div id="questions"></div>
    <div id="learning-container"></div>
  </main>
</body>
</html>
